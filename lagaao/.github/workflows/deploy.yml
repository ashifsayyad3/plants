name: Deploy to Production

on:
  push:
    branches: [main]

# Only one deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─── Test / lint (fast gate before deploying) ──────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend — install & lint
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install & lint
        working-directory: frontend
        run: |
          npm ci
          npx ng lint --max-warnings=0

  # ─── Deploy (only after lint passes) ─────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: deploy
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            set -e
            cd /var/www/lagaao
            git fetch origin main
            git reset --hard origin/main
            bash deploy/scripts/deploy.sh

      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lagaao.com/api/v1/health)
          echo "Health check HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check GitHub Actions logs and VPS pm2 logs."
          # Add Slack/email notification here if needed
