# ─────────────────────────────────────────────────────────────────────────────
# Lagaao.com — NGINX Configuration
# Place at: /etc/nginx/sites-available/lagaao.com
# Enable:   ln -s /etc/nginx/sites-available/lagaao.com /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# ─── Upstream: Node.js API cluster ───────────────────────────────────────────
upstream lagaao_api {
    least_conn;                         # distribute by fewest active connections
    server 127.0.0.1:3000;
    keepalive 64;                       # persistent upstream connections
}

# ─── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=60r/m;
limit_req_zone  $binary_remote_addr  zone=api_auth:10m     rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=api_upload:10m   rate=20r/m;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lagaao.com www.lagaao.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── WWW → non-WWW redirect (HTTPS) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lagaao.com;

    ssl_certificate     /etc/letsencrypt/live/lagaao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lagaao.com/privkey.pem;

    return 301 https://lagaao.com$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lagaao.com;

    root /var/www/lagaao/frontend/dist/lagaao/browser;
    index index.html;

    # ─── SSL ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lagaao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lagaao.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lagaao.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff"                                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                                     always;
    add_header X-XSS-Protection         "1; mode=block"                                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"                always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()"       always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # ─── Connection limits ────────────────────────────────────────────────────
    limit_conn conn_limit 20;

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ─── Client body ─────────────────────────────────────────────────────────
    client_max_body_size    20M;
    client_body_buffer_size 128k;
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # ─── Proxy timeouts ───────────────────────────────────────────────────────
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ─── API routes → Node.js ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass         http://lagaao_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;

        # Hide upstream server header
        proxy_hide_header  X-Powered-By;
    }

    # ─── Auth endpoints: stricter rate limit ──────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass         http://lagaao_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── File upload endpoint ─────────────────────────────────────────────────
    location ~ ^/api/v1/files/upload {
        limit_req zone=api_upload burst=10 nodelay;

        proxy_pass         http://lagaao_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;        # stream uploads directly
    }

    # ─── Static uploaded files ────────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/lagaao/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # Block scripts from being served as static files
        location ~* \.(js|php|py|sh|rb)$ {
            deny all;
        }
    }

    # ─── Angular static assets (hashed filenames — cache forever) ────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|webp|png|jpg|jpeg|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Angular app — HTML5 routing (SPA fallback) ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html: no caching (always fetch latest)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            expires -1;
        }
    }

    # ─── Block sensitive paths ────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
    location ~ /(\.env|package\.json|tsconfig|node_modules) {
        deny all;
        return 404;
    }

    # ─── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/lagaao.access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/lagaao.error.log warn;
}
