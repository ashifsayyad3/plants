# ─────────────────────────────────────────────────────────────────────────────
# Global nginx.conf optimizations
# Merge relevant sections into /etc/nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────

user www-data;
worker_processes auto;                  # one per CPU core
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ─── MIME types ───────────────────────────────────────────────────────────
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens       off;            # hide nginx version

    # ─── Buffers ──────────────────────────────────────────────────────────────
    client_body_buffer_size  128k;
    client_max_body_size     20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers           1 32k;
    postpone_output          1460;

    # ─── Open file cache ──────────────────────────────────────────────────────
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ─── Log format ───────────────────────────────────────────────────────────
    log_format combined_custom '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log combined_custom buffer=512k flush=1m;
    error_log  /var/log/nginx/error.log warn;

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # ─── Include vhosts ───────────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
