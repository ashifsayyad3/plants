<div class="shell" [class.shell--collapsed]="!ui.sidebarOpen()">

  <!-- Global progress bar -->
  @if (ui.isLoading()) {
    <mat-progress-bar mode="indeterminate" class="shell__loader" />
  }

  <!-- Sidebar -->
  <app-sidebar class="shell__sidebar" />

  <!-- Main area -->
  <div class="shell__main">
    <app-header />
    <app-breadcrumb />

    <main class="shell__content" role="main">
      <router-outlet />
    </main>

    <app-footer />
  </div>

</div>
