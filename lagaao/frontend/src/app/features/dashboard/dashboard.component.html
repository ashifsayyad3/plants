<div class="dashboard">

  <!-- ── Page header ─────────────────────────────────────────────────────────── -->
  <div class="dashboard__header">
    <div class="dashboard__header-left">
      <h1 class="dashboard__title">Dashboard</h1>
      @if (store.lastRefreshed()) {
        <span class="dashboard__refreshed">
          Updated {{ store.lastRefreshed() | timeAgo }}
        </span>
      }
    </div>

    <div class="dashboard__header-right">
      <button mat-stroked-button
        [disabled]="store.isLoading()"
        (click)="store.loadAll()"
        matTooltip="Refresh all data">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>

      <button mat-stroked-button [matMenuTriggerFor]="exportMenu">
        <mat-icon>download</mat-icon>
        Export
      </button>
      <mat-menu #exportMenu="matMenu">
        <button mat-menu-item (click)="exportActivity()">
          <mat-icon>table_chart</mat-icon><span>Activity Log (Excel)</span>
        </button>
        <button mat-menu-item (click)="exportActivityPdf()">
          <mat-icon>picture_as_pdf</mat-icon><span>Activity Log (PDF)</span>
        </button>
      </mat-menu>
    </div>
  </div>

  <!-- ── KPI Cards ───────────────────────────────────────────────────────────── -->
  <section class="dashboard__kpi-grid">
    @for (card of kpiCards; track card.key) {
      <app-kpi-card
        [config]="card"
        [stats]="store.stats()"
        [loading]="store.loadingStats()" />
    }
  </section>

  <!-- ── Charts ──────────────────────────────────────────────────────────────── -->
  <section class="dashboard__chart-grid">
    <div class="dashboard__chart-main">
      <app-chart-card
        title="User Growth"
        subtitle="New registrations — last 30 days"
        kind="line"
        [data]="store.charts()?.userGrowth ?? []"
        [loading]="store.loadingCharts()" />
    </div>

    <div class="dashboard__chart-side">
      <app-chart-card
        title="Users by Status"
        subtitle="Active · Pending · Suspended"
        kind="doughnut"
        [data]="store.charts()?.usersByStatus ?? []"
        [loading]="store.loadingCharts()" />
    </div>
  </section>

  <!-- ── Activity bar chart ──────────────────────────────────────────────────── -->
  <section class="dashboard__chart-full">
    <app-chart-card
      title="Activity by Type"
      subtitle="Last 7 days — top actions"
      kind="bar"
      [data]="store.charts()?.activityByType ?? []"
      [loading]="store.loadingCharts()" />
  </section>

  <!-- ── Activity + Notifications ────────────────────────────────────────────── -->
  <section class="dashboard__feed-grid">

    <!-- Activity feed with search + export -->
    <div class="dashboard__feed-col">
      <div class="dashboard__search-bar">
        <mat-icon class="dashboard__search-icon">search</mat-icon>
        <input
          class="dashboard__search-input"
          type="text"
          placeholder="Search activity…"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)" />
        @if (searchQuery()) {
          <button mat-icon-button (click)="searchQuery.set('')" class="dashboard__search-clear">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <app-activity-feed
        [items]="filteredActivity()"
        [loading]="store.loadingActivity()"
        (refresh)="store.loadActivity()" />
    </div>

    <app-notification-panel
      [items]="store.notifications()"
      [loading]="store.loadingNotifications()"
      (markRead)="store.markNotificationRead($event)" />
  </section>

</div>
